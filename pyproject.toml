[project]
name = "lantai"
dynamic = ["version"]
description = "观澜台 (GuanlanTai) is a **personal assistant** that runs in your own environment. It talks to you over multiple channels (DingTalk, Feishu, QQ, Discord, iMessage, etc.) and runs scheduled tasks according to your configuration. **What it can do is driven by Skills — the possibilities are open-ended.** Built-in skills include cron, PDF/Office handling, news digest, file reading, and more; you can add custom skills. All data and tasks run on your machine; no third-party hosting."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "agent-client-protocol>=0.12.1,<0.13",
    "anthropic>=0.101.0",
    "httpx>=0.27.0",
    "httpx2>=2.10.0,<3",
    "httpcore2>=2.10.0,<3",
    "orjson>=3.10.0",
    "packaging>=24.0",
    "discord-py>=2.3",
    "slack-bolt>=1.22.0",
    "aiohttp>=3.10.0",
    "protobuf>=5.0.0",
    "dingtalk-stream>=0.24.3",
    "alibabacloud-dingtalk>=2.2.42",
    "alibabacloud-tea-openapi>=0.4.4",
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.40.0",
    "apscheduler>=3.11.2,<4",
    "playwright>=1.49.0",
    "questionary>=2.1.1",
    "mss>=9.0.0",
    "transformers>=4.30.0",
    "python-dotenv>=1.0.0",
    "python-socks>=2.5.3",
    "onnxruntime<1.24",
    "lark-oapi>=1.5.3",
    "python-telegram-bot>=20.0",
    "twilio>=9.10.2",
    "pywebview>=4.0",
    "aiofiles>=24.1.0",
    "paho-mqtt>=2.0.0",
    "wecom-aibot-python-sdk==1.0.2",
    "matrix-nio>=0.24.0",
    "shortuuid>=1.0.0",
    "google-genai>=1.67.0",
    "tzdata>=2024.1",
    "cryptography>=43.0.0",
    "psutil>=7.2.2,<8",
    "certifi>=2024.8.30",
    "keyring>=25.0.0",
    "pyyaml>=6.0",
    "json-repair>=0.30.0",
    "jsonschema>=4.23.0,<5",
    "segno>=1.6.6",
    "modelscope>=1.35.0",
    "huggingface_hub>=0.20.0",
    "pillow>=10.0.0",
    # Built-in Office/PDF skills import these packages at runtime. Keep them
    # direct dependencies so source and frozen desktop builds expose the same
    # document capabilities.
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "olefile>=0.47",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",
    "pypdfium2>=5.12.1",
    "reportlab>=4.2.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "markitdown[docx,pptx]>=0.1.3",
    "python-frontmatter>=1.1.0",
    # Offline research bibliography parsing and pinned CSL execution.
    "bibtexparser==1.4.4",
    "rispy==0.9.0",
    "quickjs==1.19.4",
    # Direct protocol dependency. SDK v2 speaks MCP 2026-07-28 while retaining
    # compatibility with earlier initialized-session servers.
    "mcp>=2.0.0,<3",
    "openai>=2.0.0,<=2.33.0",
    # Guanlan's MCP extra currently pins MCP 1.x. Lantai owns the MCP 2.x
    # adapter, so bundle the Guanlan runtime itself without that extra.
    "guanlan==0.10.9",
    "pypi-attestations>=0.0.29,<0.1",
    # anyio 4.13.0: _deliver_cancellation busy-loop / getpid storm (Lantai#2632)
    "anyio>=4.0.0,<4.13.0",
]

[tool.setuptools.dynamic]
version = {attr = "lantai.__version__.__version__"}

[tool.setuptools]
packages = { find = { where = ["src"] } }
include-package-data = true

[tool.setuptools.package-data]
# Dockerfile copies console build output to src/lantai/console/ (no dist subdir).
"lantai" = [
    "console/**",
    "agents/md_files/**",
    "agents/skills/**",
    "tokenizer/**",
    "security/tool_guard/rules/**",
    "security/skill_scanner/rules/**",
    "security/skill_scanner/data/**",
    "customization/data/**",
    "presentation/style_profiles/*.json",
    "presentation/*.mjs",
    "app/channels/yuanbao/proto/*.json",
    "app/reading/data/*",
    "app/reading/data/runtime/*",
    "research/data/*",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
lantai = "lantai.cli.main:cli"

# Optional doctor plugins: callable (DoctorRunContext) -> list[str]
# [project.entry-points."lantai.doctor"]
# my_pkg = "my_pkg.doctor:doctor_notes"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=4.2.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8,<4",
    "hypothesis>=6.0.0",
    "pyinstaller==6.20.0",
]
local = [
    "huggingface_hub>=0.20.0",
]
full = [
    "lantai[local]",
]
sip = [
    "pyVoIP>=1.6.0",
    "dashscope>=1.0.0",
    "dashscope-realtime>=0.1.0",
    "audioop-lts; python_version >= '3.13'",
]
sip-livekit = [
    "lantai[sip]",
    "livekit>=1.0.0",
    "livekit-api>=0.6.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    "src",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "contract: marks tests as contract tests",
    "integration: marks tests as integration tests",
]
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["src/lantai"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]
fail_under = 35
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
