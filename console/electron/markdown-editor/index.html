<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>澜台 Markdown</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="file-wrap">
        <button
          id="file-button"
          class="file-button"
          aria-controls="file-menu"
          aria-expanded="false"
        >
          文件
        </button>
        <div id="file-menu" class="file-menu" hidden>
          <button data-command="open">打开… <kbd>⌘O</kbd></button>
          <button data-command="save">保存 <kbd>⌘S</kbd></button>
          <button data-command="save-as">另存为… <kbd>⇧⌘S</kbd></button>
        </div>
      </div>
      <div class="document-identity">
        <span id="file-name" class="file-name"></span>
        <span class="file-kind">Markdown</span>
      </div>
      <div class="toolbar-actions">
        <button
          id="save-button"
          class="icon-button"
          title="保存 (⌘S)"
          aria-label="保存"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2Z"
            />
            <path d="M7 3v6h10V3M7 21v-8h10v8" />
          </svg>
        </button>
        <div class="view-switch" role="group" aria-label="文稿视图">
          <button
            class="view-button active"
            data-view="preview"
            aria-pressed="true"
          >
            阅读
          </button>
          <button class="view-button" data-view="edit" aria-pressed="false">
            编辑
          </button>
          <button class="view-button" data-view="split" aria-pressed="false">
            分栏
          </button>
        </div>
        <div class="handoff-wrap">
          <button
            id="handoff-button"
            class="handoff-button"
            aria-expanded="false"
            aria-controls="handoff-panel"
          >
            交给沈行知
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8 10 4 4 4-4" />
            </svg>
          </button>
          <section
            id="handoff-panel"
            class="handoff-panel"
            aria-label="交给沈行知"
            hidden
          >
            <p class="panel-title">一起完善这份文稿</p>
            <div class="co-creation-mode" role="group" aria-label="共创模式">
              <button data-mode="ask" aria-pressed="false">询问</button>
              <button class="active" data-mode="suggest" aria-pressed="true">
                建议
              </button>
              <button data-mode="execute" aria-pressed="false">执行</button>
            </div>
            <p id="handoff-scope" class="panel-description"></p>
            <p class="panel-description">带入主对话，确认后发送。</p>
            <button id="handoff-confirm" class="handoff-confirm">
              带入主对话
            </button>
          </section>
        </div>
      </div>
    </header>
    <main
      id="workspace"
      class="workspace view-preview"
      aria-label="Markdown 工作区"
    >
      <textarea
        id="editor"
        aria-label="Markdown 编辑器"
        spellcheck="true"
      ></textarea>
      <article
        id="preview"
        class="preview"
        aria-label="文稿阅读区"
        tabindex="0"
      ></article>
    </main>
    <footer class="statusbar" aria-label="文档状态">
      <span id="status" role="status" aria-live="polite">已就绪</span>
      <span id="count">0 字符</span>
    </footer>
    <script src="./renderer.js"></script>
  </body>
</html>
